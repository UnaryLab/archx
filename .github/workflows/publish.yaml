name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Build wheels for each OS/arch
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            test: true               # native: runner is x86_64 Linux
          - os: ubuntu-latest
            target: aarch64          # cross-compiled, not runnable on the runner
          - os: macos-latest
            target: aarch64
            test: true               # native: macos-latest runner is arm64
          - os: macos-latest
            target: x86_64           # cross-compiled, not runnable on the runner
          - os: windows-latest
            target: x86_64
            test: true               # native: runner is x86_64 Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: true
          manylinux: auto

      # Verify the freshly built wheel installs and imports the compiled Rust
      # core before it can reach PyPI. Only runs on natively-runnable targets;
      # cross-compiled wheels (linux/aarch64, macos/x86_64) can't execute here.
      - name: Smoke-test the wheel
        if: ${{ matrix.test }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import archx; import archx._core; print('wheel import OK:', archx.__file__)"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # Build the source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Publish everything to PyPI
  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/archx
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
