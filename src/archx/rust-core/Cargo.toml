[package]
name = "archx-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "archx_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
petgraph = { version = "0.6", features = ["serde-1"] }
indexmap = { version = ">=2.0, <2.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
pyo3-log = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
