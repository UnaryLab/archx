# FN-CACTI base config for sram and cache. cacti_fn.py prepends the query-specific keys:
#   -transistor type, -technology node, -wire technology node, -operating voltage,
#   -size, -block size, -bus width, -uca bank, -memory type, -associativity, -tag size
#   -read-write port, -exclusive read port, -exclusive write port, -access mode
# Everything below is fixed. Derived from include/cacti_fn/configs/2MB_fin.cfg.

# Operating temperature: 300 K; the XML device path also accepts 310 to 400 K in 10 K steps
-temperature 300

# ncfet - "true" for NC-FinFET, "false" for FinFET
-ncfet - "false"

# ports
-single ended read ports 0
-search port 0

-cache model - "UCA"
-nuca bank count 0

-optimize - "ED^2"
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 100:20:20:10:10
-deviate (delay, dynamic power, leakage power, cycle time, area) 10:1000:1000:1000:1000
-NUCAdesign objective (weight delay, dynamic power, leakage power, cycle time, area) 100:20:20:10:10
-NUCAdeviate (delay, dynamic power, leakage power, cycle time, area) 10:1000:1000:1000:1000

# Interconnects: "RonHo2003", "ITRS2012" or "ASAP7" (the 7 nm wire data)
-interconnects - "ASAP7"
-wire signalling - "default"
-Wire inside mat - "semi-global"
-Wire outside mat - "semi-global"
-Interconnect projection - "aggressive"

-Core count 1
-Cache level - "L3"
-Add ECC - "false"

# The parser reads the DETAILED report labels
-Print level (DETAILED, CONCISE) - "DETAILED"
-Print input parameters - "false"

-Force cache config - "false"
-Ndwl 1
-Ndbl 1
-Nspd 0
-Ndcm 1
-Ndsam1 0
-Ndsam2 0
-Ntwl 1
-Ntbl 1
-Ntspd 0
-Ntcm 1
-Ntsam1 0
-Ntsam2 0

# Main-memory only
-page size (bits) 0
-burst length 1
-internal prefetch width 1
