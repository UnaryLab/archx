# environment.yaml
name: archx_2027_ae
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - graphviz
  - python-graphviz
  - loguru
  - matplotlib
  - numpy
  - pandas
  - Pillow
  - pyfiglet
  - pyyaml
  - yamlordereddictloader
  - pytest
  - pytest-cov
  - maturin>=1.5
  - pip
  - pip:
    # ortools is not on conda-forge/defaults under this name (the conda package
    # is `ortools-python`); install the canonical wheel via pip instead.
    - ortools